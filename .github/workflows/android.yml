name: Android CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*", "*.*.*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # write needed to publish GitHub releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fetch Berlin building data
        run: |
          pip install requests
          python3 data-pipeline/fetch_osm.py \
            --bbox 52.480 13.370 52.550 13.490 \
            --out app/src/main/assets/data/berlin_buildings.geojson \
          || { echo "Overpass unavailable — using bundled sample data"; \
               cp app/src/main/assets/data/sample_buildings.geojson \
                  app/src/main/assets/data/berlin_buildings.geojson; }

      - name: Run core engine unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: shadey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish dev build
        # A single, always-overwritten pre-release so there's one stable, bookmarkable place to
        # grab the latest dev build — unlike workflow-run artifacts, this needs no GitHub login
        # and isn't tied to any one branch or run.
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: "Shadey dev build (latest)"
          body: |
            Automatically rebuilt and replaced on every push to a `claude/**` branch or `main`.
            Not a stable release — for testing in-progress work.

            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk shadey-${VERSION}.apk

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the lines under "## <version>" up to (but not including) the next "## " heading.
          awk -v hdr="## $VERSION" '
            !grab {
              if (substr($0, 1, length(hdr)) == hdr) {
                rest = substr($0, length(hdr) + 1)
                if (rest == "" || rest ~ /^[ \t\r]/) { grab = 1; next }
              }
            }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          # Fall back to a minimal body if the version has no CHANGELOG section yet.
          if [ ! -s release-notes.md ]; then
            echo "Shadey ${VERSION}" > release-notes.md
          fi
          echo "----- release notes for ${VERSION} -----"
          cat release-notes.md

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: shadey-*.apk
